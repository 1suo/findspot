<!doctype html>
<!-- Template for tools/composer.html. Do not open directly:
     run `lua scripts/generate.lua` to inject palettes and open the result. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>findspot composer</title>
<style>
  :root {
    --chrome-bg: #14161b;
    --chrome-panel: #1b1e25;
    --chrome-fg: #d7dae0;
    --chrome-muted: #8b919c;
    --chrome-line: #2a2e38;
    --chrome-accent: #7aa2f7;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--chrome-bg); color: var(--chrome-fg);
    font: 14px/1.45 system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  button, input, select { font: inherit; color: inherit; }

  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--chrome-line);
    background: var(--chrome-panel);
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .5px; }
  header h1 i { color: var(--chrome-accent); font-style: normal; }
  select, .btn {
    background: var(--chrome-bg); border: 1px solid var(--chrome-line);
    border-radius: 6px; padding: 5px 10px;
  }
  .btn { cursor: pointer; }
  .btn:hover { border-color: var(--chrome-accent); }
  #draft-note { color: #e0af68; font-size: 12px; }
  .spacer { flex: 1; }

  main {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 420px;
    gap: 14px; padding: 14px; min-height: 0; overflow: hidden;
  }
  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr; overflow: auto; }
    #sidebar { max-height: none; }
  }

  /* ---------- preview ---------- */
  #stage {
    min-height: 0; overflow: auto; display: flex; align-items: flex-start;
    justify-content: center;
  }
  .term {
    width: min(720px, 100%); border-radius: 8px; overflow: hidden;
    border: 1px solid #444; box-shadow: 0 8px 30px rgba(0,0,0,.45);
    flex: none;
  }
  .term-bar {
    display: flex; align-items: center; gap: 7px; padding: 8px 12px;
    border-bottom: 1px solid rgba(128,128,128,.25);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .term-title { margin-left: 8px; font-size: 12px; font-family: var(--mono); }
  .term-body { padding: 8px 0 6px; font-family: var(--mono); font-size: 13px; position: relative; }
  .cl { display: flex; min-height: 19px; white-space: pre; }
  .sign { width: 14px; text-align: center; flex: none; user-select: none; }
  .ln { width: 30px; text-align: right; padding-right: 10px; flex: none; user-select: none; }
  .code { flex: 1; }
  .vt { font-style: italic; margin-left: 2ch; }
  .eob .code { text-align: left; }

  .pmenu {
    position: absolute; right: 14px; top: 62px; width: 172px;
    border: 1px solid #444; border-radius: 6px; padding: 4px;
    box-shadow: 0 10px 24px rgba(0,0,0,.5); font-size: 12.5px;
  }
  .pmenu .ptitle { padding: 2px 8px 5px; }
  .pmenu .pi { padding: 2px 8px; border-radius: 4px; }
  .pmenu .pmore { padding: 2px 8px; text-align: right; }

  .cmd { padding: 4px 14px 2px; }
  .dl { padding: 0 14px; }
  .msgs { margin-top: 8px; padding: 6px 14px 4px; border-top: 1px solid rgba(128,128,128,.25); }
  .msgs div { white-space: pre; }

  .statusline {
    display: flex; gap: 0; font-family: var(--mono); font-size: 12.5px;
    border-top: 1px solid rgba(128,128,128,.25);
  }
  .statusline span { padding: 4px 9px; white-space: pre; }
  .statusline .fill { flex: 1; padding: 0; }

  [data-hover] { outline: 1.5px dashed #fff; outline-offset: 1px; }

  /* ---------- sidebar ---------- */
  #sidebar {
    min-height: 0; overflow: auto; background: var(--chrome-panel);
    border: 1px solid var(--chrome-line); border-radius: 8px; padding: 12px;
  }
  .meta-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .meta-row label { color: var(--chrome-muted); font-size: 12px; }
  .meta-row input {
    flex: 1; background: var(--chrome-bg); border: 1px solid var(--chrome-line);
    border-radius: 6px; padding: 5px 8px; font-family: var(--mono); font-size: 13px;
  }
  .hint-line { color: var(--chrome-muted); font-size: 12px; margin: 4px 0 10px; }
  .grp { margin-bottom: 12px; }
  .grp h3 {
    margin: 0 0 6px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--chrome-muted);
  }
  .row {
    display: grid; grid-template-columns: 26px 108px 82px 30px;
    gap: 8px; align-items: center; padding: 2px 4px; border-radius: 6px;
  }
  .row:hover { background: rgba(122,162,247,.08); }
  .row.flash { animation: flash 1s; }
  @keyframes flash { 0%,60% { background: rgba(122,162,247,.35); } 100% { background: transparent; } }
  .swatch {
    width: 26px; height: 22px; border-radius: 5px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.18);
  }
  .rname { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
  .hexin {
    width: 100%; background: var(--chrome-bg); border: 1px solid var(--chrome-line);
    border-radius: 5px; padding: 3px 6px; font-family: var(--mono); font-size: 12.5px;
  }
  .hexin.bad { border-color: #f7768e; color: #f7768e; }
  input[type="color"] {
    width: 30px; height: 22px; padding: 0 2px; background: none;
    border: 1px solid var(--chrome-line); border-radius: 5px; cursor: pointer;
  }
  .import-box { margin-top: 10px; }
  .import-box textarea {
    width: 100%; height: 70px; background: var(--chrome-bg); color: var(--chrome-fg);
    border: 1px solid var(--chrome-line); border-radius: 6px; padding: 6px 8px;
    font-family: var(--mono); font-size: 12px; resize: vertical;
  }

  /* ---------- x11 modal ---------- */
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #modal.open { display: flex; }
  .modal-card {
    background: var(--chrome-panel); border: 1px solid var(--chrome-line);
    border-radius: 10px; padding: 14px; width: min(560px, 92vw);
    max-height: 84vh; display: flex; flex-direction: column; gap: 10px;
  }
  .modal-card h3 { margin: 0; font-size: 13px; }
  .modal-card h3 code { color: var(--chrome-accent); }
  #x11-search {
    background: var(--chrome-bg); border: 1px solid var(--chrome-line);
    border-radius: 6px; padding: 6px 10px;
  }
  #x11-grid {
    overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, 26px);
    gap: 5px; align-content: start;
  }
  #x11-grid button {
    width: 26px; height: 22px; border-radius: 5px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.14); padding: 0;
  }
  #x11-grid button:hover { outline: 2px solid var(--chrome-accent); }
  .modal-foot { color: var(--chrome-muted); font-size: 12px; display: flex; justify-content: space-between; }
</style>
</head>
<body>

<header>
  <h1><i>findspot</i> composer</h1>
  <select id="palette-select"></select>
  <span id="draft-note" hidden>restored unsaved edits</span>
  <div class="spacer"></div>
  <button class="btn" id="btn-copy">Copy TOML</button>
  <button class="btn" id="btn-download">Download .toml</button>
  <button class="btn" id="btn-reset">Reset</button>
</header>

<main>
  <div id="stage"><div class="term" id="term"></div></div>

  <div id="sidebar">
    <div class="meta-row">
      <label>name</label>
      <input id="meta-name" spellcheck="false">
    </div>
    <div class="hint-line">
      Click a swatch for the X11 palette; hex or the native picker for custom.
      Hover a row to locate its tokens in the preview; click preview tokens to
      jump back here. Edits autosave in this browser only — export TOML to keep them.
    </div>
    <div id="tokens"></div>
    <div class="import-box">
      <button class="btn" id="btn-import-toggle">Import TOML…</button>
      <div id="import-area" hidden style="margin-top:8px">
        <textarea id="import-text" placeholder="paste palette TOML here" spellcheck="false"></textarea>
        <div style="margin-top:6px"><button class="btn" id="btn-import-load">Load</button></div>
      </div>
    </div>
  </div>
</main>

<div id="modal">
  <div class="modal-card">
    <h3>X11 color for <code id="modal-role"></code></h3>
    <input id="x11-search" placeholder="search name or hex…" spellcheck="false">
    <div id="x11-grid"></div>
    <div class="modal-foot"><span id="x11-hover">&nbsp;</span><span>Esc to close</span></div>
  </div>
</div>

/* ---------- toml ---------- */

function parseToml(text) {
  const p = {}; let sec = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    let m = line.match(/^\[(.+)\]$/);
    if (m) { sec = m[1]; p[sec] = p[sec] || {}; continue; }
    m = line.match(/^([\w_]+)\s*=\s*"([^"]*)"/);
    if (m && sec) p[sec][m[1]] = m[2];
  }
  return p;
}

function fmtToml(p) {
  const out = ["[meta]", 'name = "' + (p.meta && p.meta.name || "Untitled") + '"', ""];
  const secs = new Set(Object.keys(p).filter((s) => s !== "meta"));
  for (const [s, keys] of SCHEMA) {
    if (!p[s]) continue;
    secs.delete(s);
    out.push("[" + s + "]");
    const ks = new Set(Object.keys(p[s]));
    for (const k of keys) {
      if (p[s][k] !== undefined) { out.push(k + ' = "' + p[s][k] + '"'); ks.delete(k); }
    }
    for (const k of ks) out.push(k + ' = "' + p[s][k] + '"');
    out.push("");
  }
  for (const s of secs) {
    out.push("[" + s + "]");
    for (const k in p[s]) out.push(k + ' = "' + p[s][k] + '"');
    out.push("");
  }
  return out.join("\n") + "\n";
}

/* ---------- palette state ---------- */

const clone = (o) => JSON.parse(JSON.stringify(o));

function c(section, key) {
  const v = state.cur[section] && state.cur[section][key];
  return v || "#ff00ff";
}
const role = (r) => { const [s, k] = r.split("_"); return c(s, k); };

function saveDraft() {
  try { localStorage.setItem(state.draftKey, fmtToml(state.cur)); } catch (e) {}
}

function loadPalette(name, importedText) {
  const src = importedText !== undefined
    ? parseToml(importedText)
    : EMBEDDED.find((p) => p.meta.name === name) || EMBEDDED[0];
  state = { source: clone(src), cur: clone(src), draftKey: "findspot:" + (src.meta.name || "?") };
  $("#draft-note").hidden = true;
  if (importedText === undefined) {
    try {
      const draft = localStorage.getItem(state.draftKey);
      if (draft) { state.cur = parseToml(draft); $("#draft-note").hidden = false; }
    } catch (e) {}
  }
  syncSelect(src.meta.name, importedText !== undefined);
  $("#meta-name").value = state.cur.meta.name || "";
  buildTokens();
  buildPreview();
  paint();
}

function syncSelect(name, isImported) {
  const sel = $("#palette-select");
  sel.querySelectorAll("option[data-imported]").forEach((o) => o.remove());
  let hit = false;
  for (const o of sel.options) if (o.value === name) { hit = true; break; }
  if (!hit) {
    sel.insertAdjacentHTML("beforeend",
      '<option data-imported value="' + escapeAttr(name) + '">' + escapeHtml(name) + "</option>");
  }
  sel.value = name;
}

/* ---------- preview ---------- */

const P = (fg) => 'data-fg="' + fg + '"';

  rows.push(cl(["-"], "6", [

  rows.push(cl([], "7", [
    t("syntax_keyword", "    return "),
    t("syntax_operator", "-"),
    t("syntax_number", "1"),
    t("syntax_operator", ";"),
  ]));
  rows.push(cl([], "8", [t("syntax_operator", "  }")]));
  rows.push(cl([], "9", [
    t("ui_muted", "▸ ⋯ folded: render(palette) ⋯"),
  ], "ui_surface"));
  rows.push(cl([], "10", [
    t("syntax_function", "  printf"),
    t("syntax_operator", "("),
    t("syntax_string", '"'),
    t("ui_background", "theme", "accent_secondary"),
    t("syntax_string", ': '),
    t("syntax_special", "%s"),
    t("syntax_string", '\\n"'),
    t("syntax_operator", ", "),
    t("ui_foreground", "name"),
    t("syntax_operator", ")"),
    vt("status_hint", "⇄ ?"),
  ]));
  rows.push(cl([], "11", [t("syntax_operator", "}")]));
  rows.push('<div class="cl eob">' + sign("&nbsp;") + ln("") +
    '<span class="code">' + t("ui_border", "~") + t("ui_border", "~") + "</span></div>");

  const fileName = slug(state.cur.meta.name || "palette") + ".toml";
  const html = `
  <div class="term-bar">

  </div>

    <div class="pmenu" data-bg="ui_surface">
      <div class="ptitle" ${P("ui_muted")}>palettes/</div>

    </div>
    <div class="cmd" ${P("ui_muted")}>$ git diff</div>
    <div class="dl" ${P("diff_removed")} data-bga="diff_removed">- background = "#000000"</div>
    <div class="dl" ${P("diff_added")} data-bga="diff_added">+ background = "#0A0A0A"</div>
    <div class="dl" ${P("diff_changed")} data-bga="diff_changed">~ keyword = "#FFD700"</div>
    <div class="msgs">
      <div ${P("status_error")}>✗ invalid hex "#GGG000"</div>
      <div ${P("status_warning")}>⚠ near-duplicate hue</div>
      <div ${P("status_success")}>✓ schema ok — 27 roles</div>
      <div ${P("status_info")}>ℹ 6 palettes, 2 ports</div>

/* preview building blocks */
function t(fg, text, bg) {
  return `<span ${bg ? 'data-bg="' + bg + '" ' : ""}${fg ? P(fg) : ""}>${escapeHtml(text)}</span>`;
}
const vt = (fg, text) => `<span class="vt" ${P(fg)}>${text}</span>`;
const cursor = () => `<span data-bg="ui_cursor" ${P("ui_background")}>&nbsp;</span>`;
const sign = (s) => `<span class="sign" ${s === "&nbsp;" ? "" : P(signRole(s))}>${s}</span>`;
const ln = (n, fg) => `<span class="ln" ${P(fg || "ui_muted")}>${n}</span>`;
const signRole = (s) => ({ "+": "diff_added", "~": "diff_changed", "-": "diff_removed" }[s]);
function cl(signs, num, code, rowBg, numFg) {
  return `<div class="cl"${rowBg ? ` data-bg="${rowBg}"` : ""}>${sign(signs[0] || "&nbsp;")}${ln(num, numFg)}<span class="code">${code.join("")}</span></div>`;
}

/* ---------- painting ---------- */

function paint() {
  term.style.background = c("ui", "background");
  term.style.borderColor = c("ui", "border");
  for (const el of term.querySelectorAll("[data-fg]")) el.style.color = role(el.dataset.fg);
  for (const el of term.querySelectorAll("[data-bg]")) el.style.background = role(el.dataset.bg);
  for (const el of term.querySelectorAll("[data-bga]")) {
    el.style.background = role(el.dataset.bga) + "26"; /* 15% alpha tint */
  }
}

/* ---------- token editor ---------- */

function knownGroups(p) {
  const groups = SCHEMA.filter(([s]) => p[s]);
  const extra = Object.keys(p).filter((s) => s !== "meta" && !SCHEMA.some(([k]) => k === s));
  for (const s of extra) {
    groups.push([s, Object.keys(p[s])]);
  }
  return groups;
}

function buildTokens() {
  const box = $("#tokens");
  box.innerHTML = "";
  for (const [sec, keys] of knownGroups(state.cur)) {
    const grp = document.createElement("div");
    grp.className = "grp";
    grp.innerHTML = `<h3>${escapeHtml(sec)}</h3>`;
    for (const key of keys) {
      grp.insertAdjacentHTML("beforeend", rowHtml(sec, key));
    }
    box.appendChild(grp);
  }
}

function rowHtml(sec, key) {
  const r = sec + "_" + key;
  const v = c(sec, key);
  return `
  <div class="row" data-role="${r}">
    <button class="swatch" style="background:${v}" data-role="${r}" title="pick X11 color"></button>
    <span class="rname" title="${r}">${escapeHtml(key)}</span>
    <input class="hexin" value="${v}" spellcheck="false" data-role="${r}">
    <input type="color" value="${v}" data-role="${r}">
  </div>`;
}

function setRole(r, value, except) {
  const [s, ...rest] = r.split("_");
  const k = rest.join("_");
  state.cur[s] = state.cur[s] || {};
  state.cur[s][k] = value;
  saveDraft();
  paint();
  for (const el of document.querySelectorAll(`#tokens [data-role="${r}"]`)) {
    if (el === except) continue;
    if (el.classList.contains("swatch") || el.type === "color") {
      el.style.background = value;
      el.value = value;
    } else if (el.classList.contains("hexin")) {
      el.value = value;
      el.classList.remove("bad");
    }
  }
}

function flashRow(r) {
  const row = document.querySelector(`#tokens .row[data-role="${r}"]`);
  if (!row) return;
  row.scrollIntoView({ block: "center" });
  row.classList.remove("flash");
  void row.offsetWidth;
  row.classList.add("flash");
}

/* ---------- events ---------- */

$("#tokens").addEventListener("input", (e) => {
  const r = e.target.dataset.role;
  if (!r) return;
  if (e.target.type === "color") { setRole(r, e.target.value); return; }
  const v = e.target.value.trim();
  const ok = /^#[0-9a-fA-F]{6}$/.test(v);
  e.target.classList.toggle("bad", !ok);
  if (ok) setRole(r, v.toLowerCase(), e.target);
});

$("#tokens").addEventListener("click", (e) => {
  if (e.target.classList.contains("swatch")) openModal(e.target.dataset.role);
});

$("#tokens").addEventListener("mouseover", (e) => {
  const row = e.target.closest(".row");
  markPreview(row ? row.dataset.role : null, true);
});
$("#tokens").addEventListener("mouseout", (e) => {
  const row = e.target.closest(".row");
  markPreview(row ? row.dataset.role : null, false);
});

term.addEventListener("click", (e) => {
  const el = e.target.closest("[data-fg],[data-bg],[data-bga]");
  if (!el) return;
  flashRow(el.dataset.fg || el.dataset.bg || el.dataset.bga);
});

function markPreview(r, on) {
  term.querySelectorAll("[data-hover]").forEach((el) => el.removeAttribute("data-hover"));
  if (!r) return;
  const [s, k] = r.split("_");
  if (!state.cur[s] || state.cur[s][k] === undefined) return;
  term.querySelectorAll(`[data-fg="${r}"],[data-bg="${r}"],[data-bga="${r}"]`)
    .forEach((el) => el.setAttribute("data-hover", ""));
}

$("#meta-name").addEventListener("input", (e) => {
  state.cur.meta = state.cur.meta || {};
  state.cur.meta.name = e.target.value;
  saveDraft();
});

$("#palette-select").addEventListener("change", (e) => loadPalette(e.target.value));

$("#btn-reset").addEventListener("click", () => {
  try { localStorage.removeItem(state.draftKey); } catch (err) {}
  state.cur = clone(state.source);
  $("#draft-note").hidden = true;
  $("#meta-name").value = state.cur.meta.name || "";
  syncSelect(state.cur.meta.name);
  buildTokens();
  paint();
});

$("#btn-copy").addEventListener("click", async () => {
  const text = fmtToml(state.cur);
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  const b = $("#btn-copy"); b.textContent = "Copied ✓";
  setTimeout(() => (b.textContent = "Copy TOML"), 900);
});

$("#btn-download").addEventListener("click", () => {
  const blob = new Blob([fmtToml(state.cur)], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = slug(state.cur.meta.name || "palette") + ".toml";
  a.click();
  URL.revokeObjectURL(a.href);
});

$("#btn-import-toggle").addEventListener("click", () => {
  $("#import-area").hidden = !$("#import-area").hidden;
});
$("#btn-import-load").addEventListener("click", () => {
  const text = $("#import-text").value.trim();
  if (!text) return;
  const p = parseToml(text);
  if (!p.meta || !p.meta.name) { p.meta = { name: "Imported" }; }
  loadPalette(p.meta.name, text);
});

/* ---------- x11 modal ---------- */

let editingRole = null;

function openModal(r) {
  editingRole = r;
  $("#modal-role").textContent = r;
  $("#x11-search").value = "";
  filterX11("");
  $("#modal").classList.add("open");
  $("#x11-search").focus();
}

function filterX11(q) {
  q = q.trim().toLowerCase();
  const grid = $("#x11-grid");
  grid.innerHTML = "";
  for (const [name, hex] of X11) {
    if (q && !name.includes(q) && !hex.toLowerCase().includes(q)) continue;
    const b = document.createElement("button");
    b.style.background = hex;
    b.title = name + " " + hex.toLowerCase();
    b.dataset.hex = hex.toLowerCase();
    b.dataset.name = name;
    grid.appendChild(b);
  }
}

$("#x11-search").addEventListener("input", (e) => filterX11(e.target.value));
$("#x11-search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const first = $("#x11-grid button");
    if (first) { setRole(editingRole, first.dataset.hex); closeModal(); }
  }
});
$("#x11-grid").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  setRole(editingRole, e.target.dataset.hex);
  flashRow(editingRole);
  closeModal();
});
$("#x11-grid").addEventListener("mouseover", (e) => {
  if (e.target.tagName === "BUTTON")
    $("#x11-hover").textContent = e.target.dataset.name + "  " + e.target.dataset.hex;
});
$("#modal").addEventListener("click", (e) => { if (e.target === $("#modal")) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

function closeModal() { $("#modal").classList.remove("open"); }

/* ---------- utils ---------- */

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (ch) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function escapeAttr(s) { return escapeHtml(s); }
function slug(name) { return String(name).toLowerCase().trim().replace(/\s+/g, "-"); }

/* ---------- boot ---------- */

{
  const sel = $("#palette-select");
  for (const p of EMBEDDED) {
    sel.insertAdjacentHTML("beforeend",
      `<option value="${escapeAttr(p.meta.name)}">${escapeHtml(p.meta.name)}</option>`);
  }
  loadPalette(EMBEDDED[0].meta.name);
}
