name: Generate ports and screenshots

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-outputs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 alacritty neovim xvfb imagemagick fonts-dejavu-core xdotool
      - name: Regenerate application ports
        run: lua scripts/generate.lua
      - name: Package Obsidian community theme
        run: lua scripts/package-obsidian.lua
      - name: Validate all generated Neovim colorschemes
        run: |
          for name in alexandria babylon knossos petra tikal troy; do
            nvim --headless --clean -u NONE --cmd "set runtimepath^=$PWD" -c "colorscheme findspot-$name" -c "qa"
          done
      - name: Capture real Alacritty + Neovim sessions
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash scripts/screenshots.sh
      - name: Commit generated ports and screenshots
        run: |
          git add colors ports tools/composer.html screenshots theme.css
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate ports and application screenshots"
          git push
