name: Publish Obsidian theme release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (x.y.z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up Lua
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - name: Generate and validate theme package
        id: package
        shell: bash
        run: |
          lua scripts/generate.lua
          lua scripts/package-obsidian.lua
          version="$(jq -r .version manifest.json)"
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then tag="${{ inputs.tag }}"; fi
          if [[ "$version" != "$tag" ]]; then
            echo "Tag $tag does not match manifest version $version" >&2
            exit 1
          fi
          bash scripts/check-obsidian-theme.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release with Obsidian assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.version }}" manifest.json theme.css \
            --title "Findspot ${{ steps.package.outputs.version }}" \
            --generate-notes
